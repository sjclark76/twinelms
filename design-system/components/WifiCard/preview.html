<!-- @dsCard group="Features" height=240 subtitle="Scan to join, or copy the password" -->
<div class="nest" style="padding:16px;background:var(--cream)">
  <div class="nest-card nest-wifi">
    <div class="nest-wifi-qr" id="qr" role="img" aria-label="QR code to join The Quack House Guest Wi-Fi"></div>
    <div>
      <h3>Wi-Fi</h3>
      <dl><dt>Network</dt><dd>The Quack House Guest</dd><dt>Password</dt><dd>Quackers</dd></dl>
      <p class="nest-hint">Point your phone camera at the code to join.</p>
      <button class="nest-btn nest-btn-quiet nest-btn-sm" id="copy">Copy password</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  var box=document.getElementById('qr');
  try{var q=qrcode(0,'M');q.addData('WIFI:T:WPA;S:The Quack House Guest;P:Quackers;;');q.make();
    var n=q.getModuleCount(),s='<svg viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges"><path fill="var(--ink)" d="';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))s+='M'+c+' '+r+'h1v1h-1z';
    box.innerHTML=s+'"/></svg>';}catch(e){box.textContent='QR code';}
  document.getElementById('copy').onclick=function(){var b=this;try{navigator.clipboard.writeText('Quackers').then(function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy password'},1500)})}catch(e){}};
</script>
