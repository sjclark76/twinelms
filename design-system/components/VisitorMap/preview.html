<!-- @dsCard group="Features" height=420 subtitle="Pins, labels and the add-your-town form" -->
<div class="nest nest-stack" style="padding:16px;background:var(--cream)">
  <div class="nest-map" style="height:200px">
    <span class="nest-map-stat">Guests from 38 towns in 12 countries</span>
    <span class="nest-pin" style="position:absolute;left:18%;top:42%"></span>
    <span class="nest-pin" style="position:absolute;left:47%;top:32%"></span>
    <span class="nest-pin" style="position:absolute;left:52%;top:36%"></span>
    <span class="nest-pin" style="position:absolute;left:78%;top:40%"></span>
    <span class="nest-pin" style="position:absolute;left:86%;top:72%"></span>
    <span class="nest-pin nest-pin-home" style="position:absolute;left:91%;top:80%" title="The Nest"></span>
    <span class="nest-pin-label" style="position:absolute;left:54%;top:46%"><b>Munich, Germany</b>3 visits</span>
  </div>
  <div class="nest-card" style="max-width:420px">
    <div class="nest-field">
      <label for="town">Where's home?</label>
      <input class="nest-input" id="town" placeholder="Melbourne, Australia">
      <span class="nest-help">We only show your town on the map, never your name.</span>
    </div>
    <div style="margin-top:12px"><button class="nest-btn nest-btn-warm">Add your home town</button></div>
  </div>
</div>
